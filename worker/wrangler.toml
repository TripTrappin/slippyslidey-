name = "slippy-leaderboard"
main = "leaderboard.js"
compatibility_date = "2024-12-01"

# Bind a KV namespace called LEADERBOARD. Run:
#   npx wrangler kv namespace create LEADERBOARD
# and paste the printed `id` and `preview_id` below.
[[kv_namespaces]]
binding = "LEADERBOARD"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_NAMESPACE_ID"
